name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: .NET 10 Installation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Download of Dalamud Dependencies
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Dependencies Restoration
        run: dotnet restore

      - name: Run of Unit Test
        run: dotnet test --configuration Release --no-restore --verbosity normal

      - name: Release Build
        run: dotnet build --configuration Release --no-restore

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasePlugin-Build
          path: BasePlugin/bin/x64/Release/BasePlugin/latest.zip

      - name: GitHub Release Publishing
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BasePlugin/bin/x64/Release/BasePlugin/latest.zip
          generate_release_notes: true